<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://loopera.ru/" />
    <link rel="icon" type="image/svg+xml" href="/loopera.svg" />
    <title>Loopera — сайт перенесён</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #ffffff;
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
      }

      .card {
        width: 100%;
        max-width: 480px;
        padding: 40px 32px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.03);
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
      }

      .logo {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
      }

      .logo img {
        width: 32px;
        height: 16px;
      }

      .logo span {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        line-height: 1.35;
        margin-bottom: 12px;
      }

      p {
        color: rgba(255, 255, 255, 0.72);
        line-height: 1.6;
        margin-bottom: 28px;
      }

      .domain {
        color: #ff215c;
        font-weight: 600;
      }

      .button {
        display: inline-block;
        padding: 14px 28px;
        border-radius: 999px;
        background: #ff215c;
        color: #ffffff;
        font-size: 1rem;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.2s ease, transform 0.2s ease;
      }

      .button:hover {
        background: #ff6b8b;
        transform: translateY(-1px);
      }

      .note {
        margin-top: 20px;
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.45);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">
        <img src="/loopera.svg" alt="" width="32" height="16" />
        <span>Loopera</span>
      </div>
      <h1>Сайт перенесён</h1>
      <p>
        Loopera теперь работает на новом адресе —
        <span class="domain">loopera.ru</span>.
        Старый домен больше не используется.
      </p>
      <a class="button" href="https://loopera.ru/">Перейти на loopera.ru</a>
      <p class="note">Сохраните новый адрес в закладки.</p>
    </main>
  </body>
</html>
